name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project with Vite
        run: npm run build

      - name: Ensure .nojekyll in dist
        run: touch dist/.nojekyll

      # Method 1: Deploy to GitHub Pages environment (when Settings -> Pages -> Source is "GitHub Actions")
      - name: Setup Pages
        id: setup-pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        id: upload-pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Method 2: Also push to gh-pages branch (when Settings -> Pages -> Source is "Deploy from a branch -> gh-pages")
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          force_orphan: true
